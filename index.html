<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本の紹介カード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#4c332b}
header{background:var(--accent,#a9c9bb);padding:12px 16px;position:sticky;top:0;z-index:2;color:var(--ink,#4c332b)}header b{font-size:17px}
main{max-width:900px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}
canvas{width:100%;height:auto;display:block;border-radius:6px}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #d5d0ca;border-radius:9px;font-size:16px}textarea{min-height:110px}
button{padding:11px 14px;border:0;border-radius:9px;margin:10px 5px 0 0;font-weight:700;font-size:15px}.p{background:var(--ink,#4c332b);color:white}.s{background:var(--soft,#e2eee9);color:var(--ink,#4c332b)}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0;margin:0}.swatch.active{box-shadow:0 0 0 2px #333}.custom-wrap{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px}.custom-wrap input{width:48px;height:38px;padding:2px;border-radius:8px}.custom-wrap span{color:#766e68}
small{color:#766e68;line-height:1.5}.hint{margin:5px 0 0;font-size:12px;color:#766e68}
@media(max-width:700px){.grid{grid-template-columns:1fr}.box:first-child{order:0}.box:last-child{order:1}}
</style></head><body>
<header><b>📚 本の紹介カード</b></header><main><div class="grid">
<div class="box"><canvas id="c" width="1240" height="1754"></canvas></div>
<div class="box">
<label>カードの色</label>
<div class="palette" id="palette" aria-label="カードの色を選択"></div>
<div class="custom-wrap"><input id="customColor" type="color" value="#a9c9bb" aria-label="好きな色"><span>好きな色を選ぶこともできます</span></div>
<p class="hint">色を選ぶと、背景・見出し・アクセントが自動でまとまります。</p>
<label>本の写真</label><input id="photo" type="file" accept="image/*">
<label>書籍名</label><input id="title" value="また、どこかで会えたら">
<label>作者名</label><input id="author" value="寺地はるな">
<label>出版社名</label><input id="pub" value="中央公論新社">
<label>出版年</label><input id="year" value="2023年">
<label>ひとこと</label><input id="tag" value="いつもの風景の中に、小さな希望が見つかる。">
<label>紹介文</label><textarea id="blurb">何気ない日常の中で出会う人のやさしさや、ちょっとした奇跡を描いた一冊です。
読むと心がふっと軽くなり、あたたかな気持ちになれます。</textarea>
<button class="p" id="save">画像として保存</button><button class="s" id="share">共有する</button>
<p><small>入力するとプレビューが自動更新されます。スマホでは「画像として保存」したPNGをそのままLINEやWeChat等で送れます。</small></p>
</div></div></main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let img=null;
const $=id=>document.getElementById(id);
const palettes=[
  {name:'ミント×チョコ',accent:'#a9c9bb',ink:'#4c332b',soft:'#e2eee9',paper:'#faf8f2'},
  {name:'ピンク×ボルドー',accent:'#e7b9c5',ink:'#6b303d',soft:'#f7e4e8',paper:'#fff9fa'},
  {name:'ブルー×ネイビー',accent:'#a9c9df',ink:'#243d55',soft:'#e4eff6',paper:'#f8fbfd'},
  {name:'グリーン×深緑',accent:'#b8cfad',ink:'#31523a',soft:'#e6efe2',paper:'#fafcf8'},
  {name:'ラベンダー×紫',accent:'#c8b9d9',ink:'#4d3d62',soft:'#eee8f3',paper:'#fbf9fd'},
  {name:'オレンジ×ブラウン',accent:'#e8bd91',ink:'#67422b',soft:'#f7eadc',paper:'#fffaf5'},
  {name:'モノトーン',accent:'#c7c7c7',ink:'#333333',soft:'#eeeeee',paper:'#fafafa'}
];
function hexToRgb(h){h=h.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}
function mix(a,b,t){let A=hexToRgb(a),B=hexToRgb(b);return '#'+[A.r,A.g,A.b].map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function luminance(h){let {r,g,b}=hexToRgb(h);[r,g,b]=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
function makeTheme(accent){let ink=luminance(accent)>0.48?'#3b332e':'#ffffff';let dark=luminance(accent)>0.48?mix(accent,'#2f211b',.62):mix(accent,'#111111',.42);let soft=mix(accent,'#ffffff',.78);let paper=mix(accent,'#ffffff',.94);return {accent,ink:dark,soft,paper}}
function setTheme(theme){document.documentElement.style.setProperty('--accent',theme.accent);document.documentElement.style.setProperty('--ink',theme.ink);document.documentElement.style.setProperty('--soft',theme.soft);document.documentElement.style.setProperty('--paper',theme.paper);draw()}
function selectTheme(theme,el){document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');setTheme(theme)}
palettes.forEach((p,i)=>{let b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.title=p.name;b.setAttribute('aria-label',p.name);b.style.background=p.accent;b.onclick=()=>selectTheme(p,b);$('palette').appendChild(b)});
$('customColor').oninput=e=>{document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));setTheme(makeTheme(e.target.value))};
function wrap(t,w,f){x.font=f;let a=[];for(let p of t.split('\n')){let l='';for(let ch of p){if(x.measureText(l+ch).width>w&&l){a.push(l);l=ch}else l+=ch}a.push(l)}return a}
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function draw(){
 const cs=getComputedStyle(document.documentElement),accent=cs.getPropertyValue('--accent').trim(),ink=cs.getPropertyValue('--ink').trim(),soft=cs.getPropertyValue('--soft').trim(),paper=cs.getPropertyValue('--paper').trim();
 x.fillStyle=paper;x.fillRect(0,0,1240,1754);x.fillStyle=accent;x.fillRect(0,0,1240,180);
 x.fillStyle=luminance(accent)>0.48?ink:'#fff';x.font='700 48px sans-serif';x.fillText('心が少し、',55,55);x.fillText('やさしくなる一冊',55,115);
 x.fillStyle=ink;x.font='20px Georgia';x.fillText('BOOK INTRODUCTION',855,72);
 x.fillStyle=mix(accent,'#ffffff',.72);x.fillRect(0,180,700,1325);
 if(img){let s=Math.max(700/img.width,1325/img.height),w=img.width*s,h=img.height*s;x.save();x.beginPath();x.rect(0,180,700,1325);x.clip();x.drawImage(img,(700-w)/2,180+(1325-h)/2,w,h);x.restore()}
 else{x.fillStyle=mix(accent,'#333333',.25);x.font='28px sans-serif';x.textAlign='center';x.fillText('ここに本の写真を入れてください',350,840);x.textAlign='left'}
 x.fillStyle=ink;x.font='700 62px sans-serif';wrap($('title').value,430,x.font).slice(0,3).forEach((l,i)=>x.fillText(l,760,250+i*78));
 x.fillStyle=accent;x.fillRect(760,500,400,5);
 [['著　者',$('author').value],['出版社',$('pub').value],['出版年',$('year').value]].forEach((m,i)=>{let y=555+i*72;rr(760,y,125,43,8,soft);x.fillStyle=ink;x.font='18px sans-serif';x.textAlign='center';x.fillText(m[0],822,y+29);x.textAlign='left';x.fillStyle=ink;x.font='25px sans-serif';x.fillText(m[1],910,y+29)});
 rr(760,790,400,135,18,soft);x.fillStyle=ink;x.font='700 27px sans-serif';wrap($('tag').value,340,x.font).slice(0,3).forEach((l,i)=>x.fillText(l,790,825+i*38));
 x.fillStyle=ink;x.font='22px sans-serif';wrap($('blurb').value,400,x.font).slice(0,13).forEach((l,i)=>x.fillText(l,760,975+i*34));
 x.fillStyle=accent;x.fillRect(760,1435,400,4);x.font='24px sans-serif';x.textAlign='center';x.fillText('きっと、どこかでまた、',960,1490);x.fillText('いいことがある。',960,1530);
 x.fillStyle=ink;x.font='15px Georgia';x.textAlign='left';x.fillText('GOOD BOOKS, A KINDER TOMORROW.',55,1695);
}
['title','author','pub','year','tag','blurb'].forEach(id=>$(id).oninput=draw);
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let i=new Image();i.onload=()=>{img=i;draw()};i.src=URL.createObjectURL(f)};
$('save').onclick=()=>{let a=document.createElement('a');a.download='book_introduction.png';a.href=c.toDataURL('image/png');a.click()};
$('share').onclick=()=>c.toBlob(async b=>{let f=new File([b],'book_introduction.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[f]}))await navigator.share({title:'本の紹介',files:[f]});else alert('共有非対応です。「画像として保存」を使ってください。')},'image/png');
setTheme(palettes[0]);
</script></body></html>
